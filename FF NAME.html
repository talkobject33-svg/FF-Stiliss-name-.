.box{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),var(--s1);border:1px solid var(--line);border-radius:20px;padding:17px;margin-top:13px;box-shadow:0 14px 40px -24px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04)}

@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}

.search input{position:relative;z-index:1;display:block;width:100%;height:66px;padding:0 112px 0 70px;border-radius:24.5px;background:linear-gradient(100deg,rgba(105,151,207,.13),rgba(255,255,255,.03) 38%,rgba(255,255,255,.01)),#0f0f13;border:0;color:#fff;font:inherit;font-size:18px;font-weight:700;letter-spacing:.015em;outline:none;box-shadow:inset 0 2px 12px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);caret-color:var(--acc2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}

.nm::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:0 3px 3px 0;background:var(--accg);opacity:.55;transition:opacity .25s,top .25s,bottom .25s}

.nm:hover{border-color:color-mix(in srgb,var(--c) 70%,transparent);transform:translateY(-2px);box-shadow:0 18px 38px -18px rgba(105,151,207,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.nm:hover::before{opacity:1;top:10%;bottom:10%}.nm:hover::after{opacity:1}
.nm .t{grid-column:1;grid-row:1;font-family:var(--glyph);font-size:22px;font-weight:400;line-height:1.28;min-height:29px;word-break:break-all;position:relative;z-index:1}

.nm .c .i{width:17px;height:17px}

.spbtn.done{background:#26262d;border-color:var(--line2);color:var(--text);box-shadow:none}
.empty{color:var(--mut);text-align:center;padding:56px 10px;grid-column:1/-1;font-weight:500}
.more{display:none}
#toast{position:fixed;top:auto;right:auto;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 24px));display:flex;align-items:center;gap:13px;text-align:left;padding:14px 18px 15px 14px;border-radius:18px;overflow:hidden;background:rgba(20,20,25,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);box-shadow:0 22px 50px -14px rgba(0,0,0,.95),0 0 34px -12px rgba(105,151,207,.55);z-index:1200;pointer-events:none;opacity:0;transform:translate(-50%,160%);transition:transform .38s cubic-bezier(.2,.85,.25,1),opacity .25s}

#toast .ti .i{width:19px;height:19px;stroke-width:2.4}
#toast b{display:block;font-size:14px;font-weight:700;line-height:1.25;color:var(--text)}
#toast span{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-top:1px}
#toast::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accg);transform:scaleX(0);transform-origin:left}
#toast.show::after{animation:tbar 2s linear forwards}
@keyframes tbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
